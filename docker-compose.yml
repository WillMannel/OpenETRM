services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: openetrm
      POSTGRES_PASSWORD: openetrm
      POSTGRES_DB: openetrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openetrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://openetrm:openetrm@postgres:5432/openetrm
      REDIS_URL: redis://redis:6379/0
      # This stack is local-dev/demo only -- no real deployment target uses
      # docker-compose.yml directly. ENVIRONMENT=development is what lets it boot
      # without a JWT_SECRET_KEY override (app.core.config._validate_secrets only
      # *warns* outside "production", the default everywhere else, which refuses to
      # boot on the well-known default secret). Never set ENVIRONMENT=development for
      # anything actually reachable by anyone but you: set a real JWT_SECRET_KEY
      # (`openssl rand -hex 32`) instead and leave ENVIRONMENT unset/production.
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://openetrm:openetrm@postgres:5432/openetrm
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development # see the api service's comment above
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    # backend/Dockerfile's HEALTHCHECK curls the API's /health -- meaningless here,
    # arq's worker never listens on that port. Disabling the inherited check rather
    # than leaving it to just always report unhealthy.
    healthcheck:
      test: ["NONE"]

  web:
    # Dockerfile.dev, not ./frontend's default production Dockerfile: this stack is
    # local-dev/demo (hot reload, runtime VITE_API_BASE_URL) -- see Dockerfile.dev's
    # header comment and frontend/Dockerfile's for the deployable production image.
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    environment:
      # No /api/v1 suffix -- every frontend API call already includes it in the path
      # it passes to apiClient (see frontend/src/api/client.ts's comment); adding it
      # here too would double it up in the request URL actually sent to the backend.
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
