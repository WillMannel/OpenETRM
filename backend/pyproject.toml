[project]
name = "openetrm-backend"
version = "0.1.0"
description = "OpenETRM backend: trade capture, curve building, valuation, and risk (VaR/sensitivities) for a single pilot commodity."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "arq>=0.26",
    "redis>=5.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "QuantLib>=1.35",
    "python-dateutil>=2.9",
    "bcrypt>=4.2",
    # [crypto] pulls in the `cryptography` package: RS256 verification (needed for
    # OIDC/Entra ID JWKS-based token validation, see app.modules.auth.oidc) requires
    # it -- PyJWT's HS256 path (the local access tokens) doesn't, but this way it's
    # an explicit dependency, not something relied on being present transitively.
    "pyjwt[crypto]>=2.9",
    "email-validator>=2.2",
    "prometheus-client>=0.21",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = ["B008"]  # FastAPI's Depends(...) default-argument pattern is idiomatic, not a bug

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
