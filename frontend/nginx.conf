# Serves the Vite-built SPA. Two things a default static-file server config would
# get wrong for a client-side-routed app: (1) a deep link / page refresh on
# /trades or /risk would 404 without the SPA fallback below, since there's no
# actual file at that path -- only index.html + React Router's client-side
# handling; (2) hashed asset filenames (Vite's default) are safe to cache
# indefinitely, but index.html itself must never be cached, or a redeployed build
# stays invisible to already-open tabs until a hard refresh.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
